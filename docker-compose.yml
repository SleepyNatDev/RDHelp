services:
  web:
    container_name: rd-toolbelt
    build: ./
    ports:
      - "8180:80"
    volumes:
      - image_data:/images
    networks:
      - toolbelt
    depends_on:
      - api

  api:
    container_name: rd-toolbelt-api
    build: ./server
    ports:
      - "8181:8181"
    volumes:
      - image_data:/images
    networks:
      - toolbelt
    depends_on:
      - db

  db:
    image: postgres:18.6-alpine
    container_name: rd-toolbelt-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    ports:
      - "${PG_PORT}:5432"
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql
      - postgres_data:/var/lib/postgresql
    networks:
      - toolbelt

volumes:
  postgres_data:
  image_data:
  
networks:
  toolbelt:
    driver: bridge
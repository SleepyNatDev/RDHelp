<mat-slide-toggle class="gimmeSpace" name="units" [(ngModel)]="checked"></mat-slide-toggle>
<mat-label>Metric</mat-label>
<div class="flex flex-horizontal">
    <div class="flex-content">
        <mat-card>
            <mat-card-content>
                <div [hidden]="checked()">
                    <form #fu="ngForm" (ngSubmit)="submitFreedomUnits()" (reset)="resetUnits()">
                        <mat-form-field>
                            <mat-label>ft</mat-label>
                            <input matInput pattern="^\d*$" name="height-feet" [(ngModel)]="height_ft" required #ft="ngModel">
                        </mat-form-field>
                        <mat-form-field>
                            <mat-label>in</mat-label>
                            <input matInput pattern="^\d*(\.\d{0,2})?$" name="height-inches" [(ngModel)]="height_in" required #inches="ngModel">
                        </mat-form-field>
                        <mat-form-field>
                            <mat-label>lbs</mat-label>
                            <input matInput pattern="^\d*(\.\d{0,2})?$" name="weight-lbs" [(ngModel)]="weight_lbs" required #lbs="ngModel">
                        </mat-form-field>
                        <div [hidden]="!(ft.invalid && (ft.dirty || ft.touched)) || 
                            (inches.invalid && (inches.dirty || inches.touched)) || 
                            (lbs.invalid && (lbs.dirty || lbs.touched))" class="alert">Invalid values.</div>
                        <button matButton type="submit" [disabled]="fu.invalid">Calculate</button>
                        <button matButton type="reset">Reset</button>
                    </form>
                </div>
                <div [hidden]="!checked()">
                    <form #mu="ngForm" (ngSubmit)="submitMetricUnits()" (reset)="resetUnits()">
                        <mat-form-field>
                            <mat-label>cm</mat-label>
                            <input matInput pattern="^\d*(\.\d{0,2})?$" name="height-cm" [(ngModel)]="height_cm" required #cm="ngModel">
                        </mat-form-field>
                        <mat-form-field>
                            <mat-label>kgs</mat-label>
                            <input matInput pattern="^\d*(\.\d{0,2})?$" name="weight-kg" [(ngModel)]="weight_kgs" required #kgs="ngModel">
                        </mat-form-field>
                        <div [hidden]="!(cm.invalid && (cm.dirty || cm.touched)) || 
                            (kgs.invalid && (kgs.dirty || kgs.touched))" class="alert">Invalid values.</div>
                        <button matButton type="submit" [disabled]="mu.invalid">Calculate</button>
                        <button matButton type="reset">Reset</button>
                    </form>
                </div>
            </mat-card-content>
        </mat-card>
    </div>
    <div class="flex-content" [hidden]="kgpm == 0 || isNaN(kgpm)">
        <mat-card>
            <mat-card-content>
                <mat-label>{{kgpm | number: '1.2-2'}}kg/m<sup>2</sup></mat-label>
            </mat-card-content>
        </mat-card>
    </div>
</div>

<h2 mat-dialog-title>New Recipe</h2>
<mat-dialog-content>
  <form #fu="ngForm">
    <mat-form-field>
      <mat-label>Recipe Name</mat-label>
      <input matInput name="name" [(ngModel)]="recipe().name" />
    </mat-form-field>
    <input type="file" class="file-input" accept="image/png, image/jpeg" (change)="onFileSelected($event)" #fileUpload>
    <div [hidden]="fileUploaded()">
      <div class="file-upload clickable" appDndFiles (click)="fileUpload.click()" (dragover)="$event.preventDefault()" (drop)="onDrop($event)">
        <mat-label class="elipses">Upload Image</mat-label>
      </div>
    </div>
    <div [hidden]="!fileUploaded()">
      <div class="file-upload">
        <mat-label class="elipses">{{fileName}}</mat-label>
        <mat-icon class="clickable" (click)="removeFile()">cancel</mat-icon>
      </div>
    </div>
    <mat-form-field>
      <mat-label>Recipe Description</mat-label>
      <textarea matInput name="description" [(ngModel)]="recipe().description" ></textarea>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Tags</mat-label>
      <mat-chip-grid #tagList>
        <!-- Display existing tags -->
        @for (tag of recipe().tags; track tag.name) {
          <mat-chip [removable]="true" (removed)="removeTag(tag)">
            {{ tag.name }}
            <mat-icon matChipRemove>cancel</mat-icon>
          </mat-chip>
        }
      </mat-chip-grid>
      <!-- Input for new tags -->
      <input 
        matInput
        #tagInput 
        [matChipInputFor]="tagList" 
        [matChipInputSeparatorKeyCodes]="separatorKeys" 
        [matChipInputAddOnBlur]="true" 
        (matChipInputTokenEnd)="addTag($event.value)" />
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton (click)="onNoClick()">Cancel</button>
  <button matButton [mat-dialog-close]="data.recipe" cdkFocusInitial>Ok</button>
</mat-dialog-actions>

<h2 mat-dialog-title>New Recipe</h2>
<mat-dialog-content>
  <form #fu="ngForm">
    <mat-form-field>
      <mat-label>Recipe Name</mat-label>
      <input matInput name="name" [(ngModel)]="recipe().name" />
    </mat-form-field>
    <input type="file" name="image" class="file-input" accept="image/png, image/jpeg" (change)="onFileSelected($event)" #fileUpload>
    <div [ngClass]="{ 'file-upload': true, 'clickable': !fileUploaded() }" appDndFiles (click)="handleFileUpload()" (dragover)="$event.preventDefault()" (drop)="onDrop($event)">
      <mat-label class="elipses">{{fileName || "Upload Image"}}</mat-label>
      <mat-icon [hidden]="!fileUploaded()" class="clickable" (click)="removeFile()">cancel</mat-icon>
    </div>
    <mat-form-field>
      <mat-label>Recipe Description</mat-label>
      <textarea matInput name="description" [(ngModel)]="recipe().description" ></textarea>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Tags</mat-label>
      <mat-chip-grid #tagList>
        @for (tag of recipe().tags; track tag.id) {
          <mat-chip [removable]="true" (removed)="removeTag(tag)">
            {{ tag.name }}
            <mat-icon matChipRemove>cancel</mat-icon>
          </mat-chip>
        }
      </mat-chip-grid>
      <!-- Input for new tags -->
      <input 
        matInput
        #tagInput 
        [matChipInputFor]="tagList" 
        [matChipInputSeparatorKeyCodes]="separatorKeys" 
        [matChipInputAddOnBlur]="true" 
        (matChipInputTokenEnd)="addTag($event.value)" />
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton (click)="onNoClick()">Cancel</button>
  <button matButton [mat-dialog-close]="data.recipe" cdkFocusInitial>Ok</button>
</mat-dialog-actions>

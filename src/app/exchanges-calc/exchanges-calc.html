<div class="flex">
    <mat-card class="gimmeSpace flex-content">
        <mat-card-content>
            <div>
                <form #f="ngForm" (ngSubmit)="submitExchanges()">
                    <mat-form-field>
                        <mat-label>Starch</mat-label>
                        <input matInput pattern="^\d*$" name="height-feet" [(ngModel)]="starch_in" required #starch="ngModel">
                    </mat-form-field>
                    <mat-form-field>
                        <mat-label>Vegetable</mat-label>
                        <input matInput pattern="^\d*$" name="height-inches" [(ngModel)]="veg_in" required #veg="ngModel">
                    </mat-form-field>
                    <mat-form-field>
                        <mat-label>Fruit</mat-label>
                        <input matInput pattern="^\d*$" name="weight-lbs" [(ngModel)]="fruit_in" required #fruit="ngModel">
                    </mat-form-field>
                    <mat-form-field>
                        <mat-label>Milk</mat-label>
                        <input matInput pattern="^\d*$" name="weight-lbs" [(ngModel)]="milk_in" required #milk="ngModel">
                    </mat-form-field>
                    <mat-form-field>
                        <mat-label>Meat</mat-label>
                        <input matInput pattern="^\d*$" name="weight-lbs" [(ngModel)]="meat_in" required #meat="ngModel">
                    </mat-form-field>
                    <mat-form-field>
                        <mat-label>Fat</mat-label>
                        <input matInput pattern="^\d*$" name="weight-lbs" [(ngModel)]="fat_in" required #fat="ngModel">
                    </mat-form-field>
                    <div [hidden]="!(starch.invalid && (starch.dirty || starch.touched))" class="alert">Invalid values.</div>
                    <button matButton [disabled]="f.invalid">Calculate</button>
                </form>
            </div>
        </mat-card-content>
    </mat-card>
    <div class="flex-content gimmeSpace">
        <mat-card class="flex-content">
            <mat-card-content class="flex">
                <table class="matchBg" mat-table [dataSource]="arrExchanges">
                    <ng-container matColumnDef="label">
                        <th mat-header-cell *matHeaderCellDef></th>
                        <td mat-cell *matCellDef="let element"> {{element.label}} </td>
                        <td mat-footer-cell *matFooterCellDef></td>
                    </ng-container>

                    <ng-container matColumnDef="grams">
                        <th mat-header-cell *matHeaderCellDef> Grams </th>
                        <td mat-cell *matCellDef="let element"> {{element.grams}} </td>
                        <td mat-footer-cell *matFooterCellDef> Total </td>
                    </ng-container>

                    <ng-container matColumnDef="calories">
                        <th mat-header-cell *matHeaderCellDef> Kcals </th>
                        <td mat-cell *matCellDef="let element"> {{ element.calories | number:'1.0-0' }} </td>
                        <td mat-footer-cell *matFooterCellDef> {{ total_calories | number:'1.0-0' }} </td>
                    </ng-container>

                    <ng-container matColumnDef="percent">
                        <th mat-header-cell *matHeaderCellDef> Percent </th>
                        <td mat-cell *matCellDef="let element"> {{ element.percent | number:'1.1-1' }}% </td>
                        <td mat-footer-cell *matFooterCellDef></td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                    <tr mat-footer-row *matFooterRowDef="displayedColumns"></tr>
                </table>
            </mat-card-content>
        </mat-card>
    </div>
</div>

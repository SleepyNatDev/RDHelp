<div class="flex flex-horizontal">
    <mat-card class="gimmeSpace flex-content">
        <mat-card-content>
            <div>
                <form #exchForm="ngForm" (ngSubmit)="submitExchanges()" (reset)="resetUnits()">
                    <mat-form-field>
                        <mat-label>Starch</mat-label>
                        <input matInput type="tel" pattern="^\d*$" name="starch_in" [(ngModel)]="starch_in" #starch="ngModel">
                    </mat-form-field>
                    <mat-form-field>
                        <mat-label>Vegetable</mat-label>
                        <input matInput type="tel" pattern="^\d*$" name="veg_in" [(ngModel)]="veg_in" #veg="ngModel">
                    </mat-form-field>
                    <mat-form-field>
                        <mat-label>Fruit</mat-label>
                        <input matInput type="tel" pattern="^\d*$" name="fruit_in" [(ngModel)]="fruit_in" #fruit="ngModel">
                    </mat-form-field>
                    <mat-form-field>
                        <mat-label>Milk</mat-label>
                        <input matInput type="tel" pattern="^\d*$" name="milk_in" [(ngModel)]="milk_in" #milk="ngModel">
                    </mat-form-field>
                    <mat-form-field>
                        <mat-label>Meat</mat-label>
                        <input matInput type="tel" pattern="^\d*$" name="meat_in" [(ngModel)]="meat_in" #meat="ngModel">
                    </mat-form-field>
                    <mat-form-field>
                        <mat-label>Fat</mat-label>
                        <input matInput type="tel" pattern="^\d*$" name="fat_in" [(ngModel)]="fat_in" #fat="ngModel">
                    </mat-form-field>
                    <div [hidden]="!(starch.invalid && (starch.dirty || starch.touched))" class="alert">Invalid values.</div>
                    <button matButton type="submit" [disabled]="exchForm.invalid">Calculate</button>
                    <button matButton type="reset">Reset</button>
                </form>
            </div>
        </mat-card-content>
    </mat-card>
    <div #resultTable class="flex-content gimmeSpace">
        <mat-card>
            <mat-card-content class="flex">
                <table class="matchBg" mat-table [dataSource]="arrExchanges">
                    <ng-container matColumnDef="label">
                        <th mat-header-cell *matHeaderCellDef></th>
                        <td mat-cell *matCellDef="let element"> {{element.label}} </td>
                        <td mat-footer-cell *matFooterCellDef></td>
                    </ng-container>

                    <ng-container matColumnDef="grams">
                        <th mat-header-cell *matHeaderCellDef> Grams </th>
                        <td mat-cell *matCellDef="let element"> {{element.grams}} </td>
                        <td mat-footer-cell *matFooterCellDef> Total </td>
                    </ng-container>

                    <ng-container matColumnDef="calories">
                        <th mat-header-cell *matHeaderCellDef> Kcals </th>
                        <td mat-cell *matCellDef="let element"> {{ element.calories | number:'1.0-0' }} </td>
                        <td mat-footer-cell *matFooterCellDef> {{ total_calories | number:'1.0-0' }} </td>
                    </ng-container>

                    <ng-container matColumnDef="percent">
                        <th mat-header-cell *matHeaderCellDef> Percent </th>
                        <td mat-cell *matCellDef="let element"> {{ element.percent | number:'1.0-1' }}% </td>
                        <td mat-footer-cell *matFooterCellDef></td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                    <tr mat-footer-row *matFooterRowDef="displayedColumns"></tr>
                </table>
            </mat-card-content>
        </mat-card>
    </div>
</div>

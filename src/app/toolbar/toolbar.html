<mat-toolbar>
    <a routerLink="/">
        <button matIconButton>
            <mat-icon>home</mat-icon>
        </button>
    </a>
    <div>
        <button matButton [matMenuTriggerFor]="calcs">Calculators</button>
        <mat-menu #calcs="matMenu">
            <a class="noUnderline" routerLink="/bmi-calc">
                <button mat-menu-item>BMI Calculator</button>
            </a>
            <a class="noUnderline" routerLink="/exchanges-calc">
                <button mat-menu-item>Exchanges Calculator</button>
            </a>
            <a class="noUnderline" routerLink="/msj-calc">
                <button mat-menu-item>Mifflin-St Jeor Calculator</button>
            </a>
        </mat-menu>
    </div>
    <span class="spacer"></span>
    <button matIconButton (click)="toggleDarkMode()">
        <mat-icon>
            {{ this.darkMode() == true ? "bedtime" : "bedtime_off" }}
        </mat-icon>
    </button>
    <a routerLink="/login">
        <button matIconButton>
            <mat-icon>login</mat-icon>
        </button>
    </a>
</mat-toolbar>

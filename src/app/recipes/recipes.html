<div class="flex flex-horizontal">
    <div class="flex-content left">
        <button matMiniFab class="left">
            <mat-icon>add</mat-icon>
        </button>
    </div>
    @for (recipe of recipes_shown; track recipe.name) {
        <mat-card class="recipe gimmeSpace">
            <mat-card-header>
                <mat-card-title>
                    {{recipe.name}}
                </mat-card-title>
            </mat-card-header>
            <mat-card-content>
                {{recipe.description}}
            </mat-card-content>
            <mat-card-footer class="makeSomeSpace">
                <mat-chip-set>
                    <mat-chip>tag 1</mat-chip>
                    <mat-chip>tag 2</mat-chip>
                    <mat-chip>tag 3</mat-chip>
                </mat-chip-set>
            </mat-card-footer>
        </mat-card>
    } @empty {
        <h1>Submit some recipes!</h1>
    }
</div>
